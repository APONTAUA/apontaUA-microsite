<svg xmlns="http://www.w3.org/2000/svg" class="hero-art" width="520" height="420" viewBox="0 0 520 420" role="img" aria-label="A shared study space connecting notes, a notebook, flashcards and a PDF document">
	<title>ApontaUA shared study materials</title>
			<defs>
				<linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
					<stop offset="0" stop-color="#103822" />
					<stop offset="1" stop-color="#07120c" />
				</linearGradient>
				<linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
					<stop offset="0" stop-color="#ffffff" />
					<stop offset="1" stop-color="#e9f3ec" />
				</linearGradient>
				<filter id="soft-shadow" x="-30%" y="-30%" width="170%" height="180%">
					<feGaussianBlur in="SourceAlpha" stdDeviation="7" />
					<feOffset dy="9" />
					<feComponentTransfer><feFuncA type="linear" slope="0.22" /></feComponentTransfer>
					<feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
				</filter>
			</defs>

			<!-- A shared digital desk: angular paths connect contributions without a central orbit. -->
			<path class="desk-shadow" d="M112 93 425 75l53 251-314 36z" />
			<path class="desk-surface" d="M105 82 418 64l53 251-314 36z" fill="url(#desk)" />
			<path class="desk-edge" d="m127 100 277-16m-265 31 8 39m273-55 8 39M148 335l313-20" />

			<g class="knowledge-links" aria-hidden="true">
				<path d="m142 149 28 8 13 17" />
				<path d="m381 135-17 8-15 17" />
				<path d="m170 289 19-12 21-2" />
				<path d="m388 276-20-10-18-2" />
				<path class="link-arrow" d="m177 169 7 5-8 1m178-33-7 2 3 7m-159 105 7-5 1 8m166-3-7-4 1 8" />
			</g>

			<!-- Shared library board -->
			<g class="library-board" filter="url(#soft-shadow)">
				<rect x="164" y="105" width="278" height="204" rx="15" fill="#f8fbf8" transform="rotate(-2 303 207)" />
				<path d="M164 123a15 15 0 0 1 15-15h248a15 15 0 0 1 15 15v24H164z" fill="#e6efe8" transform="rotate(-2 303 207)" />
				<g transform="rotate(-2 303 207)">
					<rect x="181" y="120" width="10" height="10" rx="3" fill="#16a34a" />
					<text class="eyebrow" x="199" y="129">DETI · BIBLIOTECA ACADÉMICA</text>
					<text class="board-title" x="184" y="171">Conhecimento</text>
					<text class="board-title" x="184" y="194">partilhado</text>
					<rect x="184" y="211" width="73" height="21" rx="10.5" fill="#dcfce7" />
					<text class="chip-text" x="195" y="225">Cálculo II</text>
					<rect x="263" y="211" width="70" height="21" rx="10.5" fill="#dcfce7" />
					<text class="chip-text" x="274" y="225">Resumo</text>
					<path d="M184 250h236" stroke="#d6e0d8" />
					<rect x="184" y="262" width="27" height="28" rx="7" fill="#dcfce7" />
					<path d="M192 270h11m-11 5h11m-11 5h7" stroke="#00843d" stroke-width="1.5" stroke-linecap="round" />
					<text class="resource-title" x="220" y="274">Apontamentos de aula</text>
					<text class="resource-meta" x="220" y="286">partilhado pela comunidade</text>
					<circle cx="398" cy="276" r="9" fill="#16a34a" />
					<circle cx="410" cy="276" r="9" fill="#fbbf24" />
					<path d="M394 279c1-5 7-5 8 0m4 0c1-5 7-5 8 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
				</g>
			</g>

			<!-- Handwritten note -->
			<g class="floating-item note-item">
				<g transform="rotate(-7 88 113)" filter="url(#soft-shadow)">
					<rect x="24" y="53" width="128" height="126" rx="7" fill="#fff8df" />
					<path d="M42 53h92v10H42z" fill="#fbbf24" />
					<text class="note-label" x="41" y="83">CÁLCULO II</text>
					<path d="m42 102 18-7 12 10 13-14 12 8 17-6m-71 24 13-5 9 7 14-8 10 3 15-5m-60 23 19-8 12 4 11-7 14 4" fill="none" stroke="#47745a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
					<path d="M42 151h51" stroke="#c2d2c5" stroke-width="2" stroke-linecap="round" />
				</g>
			</g>

			<!-- Flashcards -->
			<g class="floating-item flashcard-item">
				<g transform="rotate(8 430 83)" filter="url(#soft-shadow)">
					<rect x="366" y="29" width="128" height="116" rx="11" fill="#cbdccf" transform="translate(7 8)" />
					<rect x="366" y="29" width="128" height="116" rx="11" fill="url(#paper)" />
					<rect x="378" y="41" width="42" height="17" rx="8.5" fill="#dcfce7" />
					<text class="mini-label" x="387" y="53">FLASH</text>
					<text class="formula" x="380" y="91">∫</text>
					<path d="M409 76h68m-68 11h49m-49 11h59" stroke="#afc2b2" stroke-width="3" stroke-linecap="round" />
					<path d="M379 119h99" stroke="#d6e0d8" />
					<text class="mini-caption" x="379" y="135">3 cartões de estudo</text>
				</g>
			</g>

			<!-- Open notebook -->
			<g class="floating-item notebook-item">
				<g transform="rotate(4 119 323)" filter="url(#soft-shadow)">
					<path d="M42 274q39-10 76 2v87q-38-12-76-2z" fill="#f8fbf8" />
					<path d="M118 276q35-12 73-2v87q-37-10-73 2z" fill="#e7f0e8" />
					<path d="M118 276v87" stroke="#6b947a" stroke-width="2" />
					<path d="M54 292q24-5 48 1m-48 13q24-5 48 1m-48 13q24-5 48 1m27-26q22-7 47-4m-47 17q22-7 47-4m-47 17q22-7 47-4" stroke="#b4c7b8" stroke-width="2" stroke-linecap="round" />
					<path d="M42 274q39-10 76 2v87q-38-12-76-2z" fill="none" stroke="#d3dfd6" />
					<path d="M118 276q35-12 73-2v87q-37-10-73 2z" fill="none" stroke="#d3dfd6" />
					<rect x="52" y="350" width="76" height="20" rx="10" fill="#dcfce7" />
					<text class="mini-label green-label" x="65" y="364">CADERNO</text>
				</g>
			</g>

			<!-- PDF contribution -->
			<g class="floating-item pdf-item">
				<g transform="rotate(6 431 316)" filter="url(#soft-shadow)">
					<path d="M386 260h77l24 24v104h-101z" fill="url(#paper)" />
					<path d="M463 260v25h24" fill="#dce9de" />
					<path d="M463 260v24h24" fill="none" stroke="#c2d3c5" />
					<rect x="400" y="280" width="32" height="17" rx="4" fill="#fee2e2" />
					<text class="pdf-label" x="406" y="292">PDF</text>
					<path d="M400 311h68m-68 10h57m-57 10h62m-62 10h40" stroke="#b6c8b8" stroke-width="3" stroke-linecap="round" />
					<text class="mini-caption" x="400" y="371">Exercícios resolvidos</text>
				</g>
			</g>

			<g class="share-note">
				<path d="m286 337 18 11 18-11" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
				<rect x="271" y="350" width="110" height="27" rx="13.5" fill="#064e3b" stroke="#31764d" />
				<circle cx="286" cy="363.5" r="5" fill="#16a34a" />
				<circle cx="298" cy="363.5" r="5" fill="#fbbf24" />
				<circle cx="310" cy="363.5" r="5" fill="#34d399" />
				<text class="share-label" x="321" y="367">6 contribuidores</text>
			</g>
		<style><![CDATA[
.desk-shadow { fill: #050a07; opacity: 0.55; }
.desk-edge { fill: none; stroke: rgb(148 179 154 / 0.18); stroke-width: 1.5; }
.knowledge-links path { fill: none; stroke: #4ade80; stroke-width: 1.5; stroke-dasharray: 4 5; opacity: 0.8; }
.knowledge-links .link-arrow { stroke: #bbf7d0; stroke-width: 1.7; stroke-dasharray: none; }
.eyebrow { fill: #56715c; font: 600 8px Inter, Arial, sans-serif; letter-spacing: 0.08em; }
.board-title { fill: #153b25; font: 750 20px Inter, Arial, sans-serif; letter-spacing: -0.04em; }
.chip-text { fill: #315b3d; font: 650 9px Inter, Arial, sans-serif; }
.resource-title { fill: #254331; font: 650 9px Inter, Arial, sans-serif; }
.resource-meta { fill: #718678; font: 500 7px Inter, Arial, sans-serif; }
.note-label, .mini-label { fill: #536a59; font: 700 8px Inter, Arial, sans-serif; letter-spacing: 0.06em; }
.formula { fill: #00843d; font: 400 31px Georgia, serif; }
.mini-caption { fill: #6b8170; font: 600 7px Inter, Arial, sans-serif; }
.pdf-label { fill: #b83e48; font: 800 8px Inter, Arial, sans-serif; }
.green-label { fill: #315b3d; }
.share-label { fill: #dcfce7; font: 600 8px Inter, Arial, sans-serif; }
.floating-item { transform-box: fill-box; transform-origin: center; }
.note-item { animation: note-arrive 700ms 120ms ease both, note-drift 9s 900ms ease-in-out infinite; }
.flashcard-item { animation: card-arrive 700ms 220ms ease both, card-drift 8s 1s ease-in-out infinite; }
.notebook-item { animation: card-arrive 700ms 320ms ease both; }
.pdf-item { animation: card-arrive 700ms 400ms ease both, card-drift 10s 1.3s ease-in-out infinite reverse; }
.floating-item:hover { filter: drop-shadow(0 10px 14px rgb(22 163 74 / 0.2)); }
.knowledge-links path { animation: links-in 900ms 250ms ease both; }
@keyframes note-arrive { from { opacity: 0; transform: translate(-7px, 8px); } to { opacity: 1; transform: translate(0, 0); } }
@keyframes card-arrive { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes note-drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
@keyframes card-drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 3px; } }
@keyframes links-in { from { stroke-dashoffset: 26; opacity: 0; } to { stroke-dashoffset: 0; opacity: 0.8; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
]]></style>
</svg>